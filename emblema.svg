<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Emblema de Zavarse Parejo Consulting, Inc">
  <defs>
    <clipPath id="cTop"><circle cx="100" cy="56" r="50"/></clipPath>
    <clipPath id="cBottom"><circle cx="100" cy="144" r="50"/></clipPath>
  </defs>
  <!-- borde dorado exterior -->
  <g fill="#d9ba72">
    <circle cx="56" cy="100" r="54"/><circle cx="144" cy="100" r="54"/><circle cx="100" cy="56" r="54"/><circle cx="100" cy="144" r="54"/>
  </g>
  <!-- cuatro círculos -->
  <circle cx="56" cy="100" r="50" fill="#2b3d52"/>
  <circle cx="144" cy="100" r="50" fill="#c9a24b"/>
  <circle cx="100" cy="56" r="50" fill="#3d5672"/>
  <circle cx="100" cy="144" r="50" fill="#b9bfc7"/>
  <!-- intersecciones -->
  <circle cx="56" cy="100" r="50" fill="#d9ba72" clip-path="url(#cTop)"/>
  <circle cx="144" cy="100" r="50" fill="#d9ba72" clip-path="url(#cTop)"/>
  <circle cx="56" cy="100" r="50" fill="#33475f" clip-path="url(#cBottom)"/>
  <circle cx="144" cy="100" r="50" fill="#a3aab3" clip-path="url(#cBottom)"/>
  <!-- contornos -->
  <g fill="none" stroke="#141a22" stroke-width="3">
    <circle cx="56" cy="100" r="50"/>
    <circle cx="144" cy="100" r="50"/>
    <circle cx="100" cy="56" r="50"/>
    <circle cx="100" cy="144" r="50"/>
  </g>
  <!-- íconos -->
  <g fill="none" stroke="#141a22" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- arriba: calculadora -->
    <rect x="89" y="18" width="22" height="32" rx="3"/>
    <rect x="93" y="22" width="14" height="7" rx="1"/>
    <!-- izquierda: tarjeta -->
    <rect x="25" y="89" width="34" height="23" rx="3"/>
    <line x1="25" y1="96" x2="59" y2="96"/>
    <line x1="30" y1="105" x2="40" y2="105"/>
    <!-- derecha: monedas y calculadora -->
    <ellipse cx="146" cy="96" rx="7" ry="3"/>
    <path d="M139 96v12c0 1.7 3.1 3 7 3s7-1.3 7-3V96"/>
    <path d="M139 102c0 1.7 3.1 3 7 3s7-1.3 7-3"/>
    <rect x="157" y="86" width="16" height="24" rx="2"/>
    <rect x="160" y="89" width="10" height="5" rx="1"/>
  </g>
  <g fill="#141a22">
    <!-- teclas calculadora arriba -->
    <rect x="93" y="33" width="3.5" height="3.5"/><rect x="98.25" y="33" width="3.5" height="3.5"/><rect x="103.5" y="33" width="3.5" height="3.5"/>
    <rect x="93" y="39" width="3.5" height="3.5"/><rect x="98.25" y="39" width="3.5" height="3.5"/><rect x="103.5" y="39" width="3.5" height="3.5"/>
    <rect x="93" y="45" width="3.5" height="2.5"/><rect x="98.25" y="45" width="3.5" height="2.5"/><rect x="103.5" y="45" width="3.5" height="2.5"/>
    <!-- teclas calculadora derecha -->
    <rect x="160" y="97" width="3" height="3"/><rect x="163.5" y="97" width="3" height="3"/><rect x="167" y="97" width="3" height="3"/>
    <rect x="160" y="102.5" width="3" height="3"/><rect x="163.5" y="102.5" width="3" height="3"/><rect x="167" y="102.5" width="3" height="3"/>
    <!-- ZPC -->
    <text x="100" y="166" text-anchor="middle" font-family="Sora, 'Public Sans', Arial, sans-serif" font-weight="800" font-size="26" letter-spacing="1">ZPC</text>
  </g>
